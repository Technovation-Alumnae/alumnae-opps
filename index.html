<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We've Moved — Technovation Alumnae Opportunities Hub</title>
<meta http-equiv="refresh" content="6;url=https://technovation-alum.github.io/Opps-Hub/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1D1349;
  --electric: #0030EF;
  --electric-light: #E4E9FD;
  --coral: #F69195;
  --lime: #D8E583;
  --cream: #FAF4EC;
  --text-soft: #5C5570;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cream: #171233;
    --text-soft: #B9B4D6;
  }
}
:root[data-theme="dark"] {
  --cream: #171233;
  --text-soft: #B9B4D6;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--cream);
  font-family: 'Instrument Sans', system-ui, sans-serif;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  max-width: 560px;
  width: 100%;
  background: var(--navy);
  border-radius: 20px;
  padding: 48px 40px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(29,19,73,0.25);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: "";
  position: absolute;
  top: -60px;
  right: -60px;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, var(--electric) 0%, transparent 70%);
  opacity: 0.35;
}
.dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 22px;
  position: relative;
}
.dots span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.dots span:nth-child(1) { background: var(--electric); }
.dots span:nth-child(2) { background: var(--coral); }
.dots span:nth-child(3) { background: var(--lime); }
.eyebrow {
  font-size: 0.78em;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--lime);
  margin-bottom: 14px;
  position: relative;
}
h1 {
  font-weight: 700;
  font-size: 1.6em;
  color: #fff;
  margin: 0 0 14px;
  line-height: 1.35;
  position: relative;
}
p {
  font-size: 0.98em;
  line-height: 1.6;
  color: rgba(255,255,255,0.72);
  margin: 0 0 30px;
  position: relative;
}
.btn {
  display: inline-block;
  background: var(--electric);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.95em;
  padding: 14px 30px;
  border-radius: 30px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  position: relative;
  box-shadow: 0 6px 18px rgba(0,48,239,0.35);
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0,48,239,0.45); }
.url {
  margin-top: 22px;
  font-size: 0.8em;
  color: rgba(255,255,255,0.45);
  word-break: break-all;
  position: relative;
}
.url a { color: var(--electric-light); text-decoration: none; }
.note {
  margin-top: 28px;
  font-size: 0.78em;
  color: rgba(255,255,255,0.4);
  position: relative;
}
</style>
</head>
<body>
  <div class="card">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="eyebrow">Technovation Alumnae</div>
    <h1>The Opportunities Hub has a new home</h1>
    <p>We've moved to a new address. Update your bookmarks — you'll be redirected automatically in a few seconds.</p>
    <a class="btn" href="https://technovation-alum.github.io/Opps-Hub/">Take Me There Now &rarr;</a>
    <div class="url"><a href="https://technovation-alum.github.io/Opps-Hub/">technovation-alum.github.io/Opps-Hub/</a></div>
    <div class="note">Redirecting automatically&hellip;</div>
  </div>
</body>
</html>
