<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Technovation Alumnae Opportunities Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&amp;family=DM+Sans:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
 --slate: #2C3A4A;
 --slate-mid: #3D4F62;
 --slate-light: #546778;
 --pink: #E91E63;
 --pink-light: #FCE4EC;
 --pink-mid: #F06292;
 --orange: #FF9800;
 --orange-light: #FFF3E0;
 --warm-bg: #F7F6F3;
 --warm-border: #E8E5DF;
 --warm-border2: #DDD9D3;
 --card-bg: #FFFFFF;
 --red: #C62828;
 --red-light: #FFEBEE;
 --green: #2E7D32;
 --green-light: #E8F5E9;
 --blue: #283593;
 --blue-light: #E8EAF6;
 --teal: #00695C;
 --teal-light: #E0F2F1;
 --purple: #4527A0;
 --purple-light: #EDE7F6;
 --muted: #888;
 --text: #2C3A4A;
 --text-soft: #6B7785;
}

body {
 font-family: 'DM Sans', system-ui, sans-serif;
 background: var(--warm-bg);
 color: var(--text);
 min-height: 100vh;
 -webkit-text-size-adjust: 100%;
}

/* ── HEADER ── */
.tah-header {
 background: var(--slate);
 padding: 32px 28px 24px;
 position: relative;
 overflow: hidden;
}
.tah-header::before {
 content: '';
 position: absolute;
 inset: 0;
 background: radial-gradient(ellipse at 110% 50%, rgba(233,30,99,0.18) 0%, transparent 65%);
 pointer-events: none;
}
.tah-header-inner { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; }
.tah-header h1 {
 font-family: 'Sora', sans-serif;
 font-size: clamp(1.2em, 3.5vw, 1.75em);
 font-weight: 600;
 color: #fff;
 margin-bottom: 6px;
 line-height: 1.3;
 letter-spacing: -0.01em;
}
.tah-header .tagline {
 font-size: 0.88em;
 color: rgba(255,255,255,0.6);
 line-height: 1.5;
}
.tah-header .tah-updated {
 font-size: 0.72em;
 color: rgba(255,255,255,0.35);
 margin-top: 8px;
 display: block;
}
.tah-accent-dots {
 display: flex;
 gap: 6px;
 margin-top: 14px;
}
.tah-accent-dots span {
 width: 8px; height: 8px;
 border-radius: 50%;
 display: inline-block;
}

/* ── LEGEND ── */
.tah-legend {
 background: #fff;
 border-bottom: 1px solid var(--warm-border);
 padding: 11px 28px;
 display: flex;
 flex-wrap: wrap;
 gap: 10px 18px;
 align-items: center;
}
.tah-legend-title {
 font-size: 0.65em;
 font-weight: 600;
 text-transform: uppercase;
 letter-spacing: 0.09em;
 color: var(--muted);
}
.tah-legend-item {
 display: flex;
 align-items: center;
 gap: 5px;
 font-size: 0.75em;
 color: var(--text-soft);
}

/* ── STICKY ── */
.tah-sticky {
 position: sticky;
 top: 0;
 z-index: 100;
 box-shadow: 0 2px 12px rgba(44,58,74,0.08);
}

/* ── PERSONA STRIP ── */
.tah-persona-strip {
 background: #fff;
 border-bottom: 1px solid var(--warm-border);
 padding: 13px 28px;
}
.tah-strip-label {
 font-size: 0.64em;
 font-weight: 600;
 text-transform: uppercase;
 letter-spacing: 0.09em;
 color: var(--muted);
 margin-bottom: 8px;
 display: block;
}
.tah-strip-label em { color: var(--pink); font-style: italic; font-weight: 400; }
.tah-persona-row {
 display: flex;
 gap: 6px;
 flex-wrap: wrap;
}
.tah-pbtn {
 display: inline-flex;
 align-items: center;
 gap: 6px;
 padding: 7px 14px;
 border: 1.5px solid var(--warm-border2);
 border-radius: 20px;
 background: var(--warm-bg);
 cursor: pointer;
 font-family: 'DM Sans', sans-serif;
 font-size: 0.8em;
 font-weight: 500;
 color: var(--text-soft);
 transition: all 0.16s;
 white-space: nowrap;
 min-height: 36px;
 -webkit-tap-highlight-color: transparent;
}
.tah-pbtn:hover { border-color: var(--pink); color: var(--pink); background: var(--pink-light); }
.tah-pbtn.tah-active { background: var(--slate) !important; border-color: var(--slate) !important; color: #fff !important; font-weight: 500; }
.tah-pcount {
 background: rgba(0,0,0,0.1);
 border-radius: 10px;
 padding: 1px 6px;
 font-size: 0.74em;
 font-weight: 600;
 min-width: 18px;
 text-align: center;
}
.tah-pbtn.tah-active .tah-pcount { background: rgba(255,255,255,0.22) !important; color: #fff !important; }

/* ── FILTER BAR ── */
.tah-filter-bar {
 background: var(--warm-bg);
 border-bottom: 1px solid var(--warm-border);
 padding: 9px 28px;
 display: flex;
 gap: 14px;
 flex-wrap: wrap;
 align-items: center;
}
.tah-filter-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.tah-filter-label {
 font-size: 0.64em;
 font-weight: 600;
 text-transform: uppercase;
 letter-spacing: 0.08em;
 color: var(--muted);
 white-space: nowrap;
}
.tah-chip {
 padding: 4px 12px;
 border: 1.5px solid var(--warm-border2);
 border-radius: 20px;
 background: #fff;
 cursor: pointer;
 font-family: 'DM Sans', sans-serif;
 font-size: 0.74em;
 font-weight: 500;
 color: #666;
 transition: all 0.14s;
 white-space: nowrap;
 min-height: 30px;
 display: inline-flex;
 align-items: center;
 -webkit-tap-highlight-color: transparent;
}
.tah-chip:hover { border-color: var(--pink); color: var(--pink); }
.tah-chip.tah-active { background: var(--slate) !important; border-color: var(--slate) !important; color: #fff !important; font-weight: 500; }
.tah-chip[data-value="future"].tah-active { background: var(--teal) !important; border-color: var(--teal) !important; }
.tah-filter-sep { width: 1px; height: 16px; background: var(--warm-border2); }

/* ── CONTENT ── */
.tah-content { padding: 20px 28px 60px; max-width: 900px; margin: 0 auto; }

.tah-results-meta {
 display: flex;
 justify-content: space-between;
 align-items: center;
 gap: 12px;
 margin-bottom: 22px;
 padding-bottom: 12px;
 border-bottom: 1px solid var(--warm-border);
 flex-wrap: wrap;
}
.tah-results-meta span { font-size: 0.82em; color: var(--muted); }
.tah-meta-buttons { display: flex; gap: 8px; }
.tah-meta-buttons button {
 padding: 6px 12px;
 border: 1.5px solid var(--warm-border2);
 border-radius: 20px;
 background: #fff;
 font-family: 'DM Sans', sans-serif;
 font-size: 0.74em;
 font-weight: 500;
 color: #666;
 cursor: pointer;
 transition: all 0.14s;
 white-space: nowrap;
}
.tah-meta-buttons button:hover { border-color: var(--pink); color: var(--pink); }

/* ── SECTIONS ── */
.tah-section { margin-bottom: 38px; }
.tah-section-title {
 font-family: 'Sora', sans-serif;
 font-size: 1.15em;
 font-weight: 600;
 color: var(--slate);
 margin-bottom: 14px;
 display: flex;
 align-items: center;
 gap: 10px;
 padding-bottom: 10px;
 border-bottom: 2px solid var(--warm-border);
}
.tah-section-count {
 background: var(--pink);
 color: #fff;
 border-radius: 20px;
 padding: 2px 10px;
 font-size: 0.78em;
 font-weight: 600;
 min-width: 26px;
 text-align: center;
 font-family: 'DM Sans', sans-serif;
}

/* ── ACCORDION ITEMS ── */
.tah-item {
 border: 1px solid var(--warm-border);
 border-radius: 8px;
 margin-bottom: 10px;
 background: var(--card-bg);
 transition: all 0.18s;
 overflow: hidden;
 box-shadow: 0 1px 3px rgba(44,58,74,0.05);
}
.tah-item:hover { border-color: var(--pink-mid); box-shadow: 0 3px 10px rgba(233,30,99,0.08); }

.tah-row {
 padding: 14px 18px;
 cursor: pointer;
 display: flex;
 justify-content: space-between;
 align-items: center;
 gap: 12px;
 user-select: none;
}
.tah-row:active { background: #fafaf9; }

.tah-title {
 flex: 1;
 font-size: 0.95em;
 font-weight: 500;
 color: var(--slate);
 line-height: 1.3;
 text-align: left;
}
.tah-meta {
 display: flex;
 align-items: center;
 gap: 10px;
 margin-left: 10px;
}

/* deadline pills on row */
.tah-pill {
 padding: 3px 10px;
 border-radius: 20px;
 font-size: 0.68em;
 font-weight: 600;
 white-space: nowrap;
 text-transform: uppercase;
 letter-spacing: 0.03em;
}
.tah-pill.urgent { background: var(--red-light); color: var(--red); }
.tah-pill.soon { background: var(--orange-light); color: #B45309; }
.tah-pill.future { background: var(--teal-light); color: var(--teal); }
.tah-pill.rolling { background: var(--purple-light); color: var(--purple); }
.tah-pill.new { background: var(--green-light); color: var(--green); }

.tah-chev {
 font-size: 1em;
 color: var(--pink);
 transition: transform 0.2s;
 flex-shrink: 0;
 opacity: 0.7;
}
.tah-item.tah-open .tah-chev { transform: rotate(180deg); }

.tah-body {
 display: none;
 padding: 14px 18px 16px;
 border-top: 1px solid var(--warm-border);
 background: #FAFAF8;
}
.tah-item.tah-open .tah-body { display: block; }

.tah-mob-badges { display: none; margin-bottom: 11px; }

.tah-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 10px;
 margin-bottom: 12px;
}
.tah-detail {
 display: flex;
 gap: 7px;
 font-size: 0.86em;
 color: var(--text-soft);
 line-height: 1.45;
}
.tah-detail span:first-child { flex-shrink: 0; font-size: 1em; }
.tah-detail.full { grid-column: 1 / -1; }

.tah-foot {
 display: flex;
 justify-content: space-between;
 align-items: center;
 gap: 10px;
 margin-top: 12px;
 padding-top: 12px;
 border-top: 1px solid var(--warm-border);
}
.tah-badges { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }

/* ── BADGE PILLS ── */
.tb {
 padding: 3px 9px;
 border-radius: 20px;
 font-size: 0.64em;
 font-weight: 600;
 text-transform: uppercase;
 white-space: nowrap;
 letter-spacing: 0.03em;
}
.tb-urgent { background: var(--red-light); color: var(--red); }
.tb-soon { background: var(--orange-light); color: #92400E; }
.tb-future { background: var(--teal-light); color: var(--teal); }
.tb-new { background: var(--green-light); color: var(--green); }
.tb-priority { background: var(--pink-light); color: #9C0040; }
.tb-rolling { background: var(--purple-light); color: var(--purple); }
.tb-loc { background: var(--blue-light); color: var(--blue); }

/* ── BUTTONS ── */
.tah-btn {
 padding: 8px 16px;
 background: var(--pink);
 color: #fff !important;
 border: none;
 border-radius: 20px;
 font-family: 'DM Sans', sans-serif;
 font-size: 0.8em;
 font-weight: 500;
 cursor: pointer;
 transition: all 0.16s;
 text-decoration: none;
 white-space: nowrap;
 display: inline-block;
 box-shadow: 0 2px 6px rgba(233,30,99,0.25);
}
.tah-btn:hover { background: var(--slate); box-shadow: 0 2px 8px rgba(44,58,74,0.25); }

.tah-copy-btn {
 padding: 6px 10px;
 background: transparent;
 color: var(--muted);
 border: 1.5px solid var(--warm-border2);
 border-radius: 20px;
 font-size: 0.74em;
 cursor: pointer;
 transition: all 0.16s;
 white-space: nowrap;
 font-family: 'DM Sans', sans-serif;
}
.tah-copy-btn:hover { background: var(--warm-bg); border-color: var(--slate); color: var(--slate); }

/* ── TOAST ── */
.tah-toast {
 position: fixed;
 bottom: 24px;
 right: 24px;
 background: var(--slate);
 color: #fff;
 padding: 12px 20px;
 border-radius: 20px;
 font-size: 0.85em;
 font-weight: 500;
 z-index: 1000;
 animation: tah-slide-in 0.25s ease-out;
 box-shadow: 0 4px 16px rgba(44,58,74,0.25);
}
@keyframes tah-slide-in { from { transform: translateX(300px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes tah-fade-out { to { opacity: 0; transform: translateX(300px); } }
.tah-toast.tah-fade { animation: tah-fade-out 0.25s ease-out forwards; }

/* ── EMPTY STATE ── */
#tah-empty { display: none; text-align: center; padding: 48px 20px; color: var(--muted); }
#tah-empty h2 { font-size: 1.2em; margin-bottom: 8px; color: #555; }

/* ── FOOTER ── */
.tah-footer {
 background: var(--slate);
 color: rgba(255,255,255,0.7);
 text-align: center;
 padding: 26px;
 font-size: 0.85em;
}
.tah-footer a { color: var(--pink-mid); text-decoration: none; font-weight: 500; }
.tah-footer a:hover { text-decoration: underline; }

/* ── SECTION JUMP NAV ── */
.tah-jump-nav {
 background: #fff;
 border-bottom: 2px solid var(--warm-border);
 padding: 10px 28px;
 display: flex;
 gap: 6px;
 flex-wrap: wrap;
 align-items: center;
}
.tah-jump-label {
 font-size: 0.62em;
 font-weight: 600;
 text-transform: uppercase;
 letter-spacing: 0.09em;
 color: var(--muted);
 white-space: nowrap;
 margin-right: 4px;
}
.tah-jump-link {
 padding: 4px 11px;
 border: 1.5px solid var(--warm-border2);
 border-radius: 20px;
 background: var(--warm-bg);
 font-family: 'DM Sans', sans-serif;
 font-size: 0.73em;
 font-weight: 500;
 color: var(--text-soft);
 text-decoration: none;
 transition: all 0.14s;
 white-space: nowrap;
 display: inline-flex;
 align-items: center;
 gap: 4px;
 min-height: 28px;
 -webkit-tap-highlight-color: transparent;
}
.tah-jump-link:hover { border-color: var(--pink); color: var(--pink); background: var(--pink-light); }

/* ── FOUNDERS HUB INTRO ── */
.tah-section-intro {
 font-size: 0.85em;
 color: var(--text-soft);
 margin-top: -6px;
 margin-bottom: 14px;
 line-height: 1.5;
 font-style: italic;
}

/* ── WELCOME PROMPT ── */
.tah-welcome-prompt {
 background: linear-gradient(135deg, var(--pink-light) 0%, #FFF8F0 100%);
 border: 1.5px solid rgba(233,30,99,0.18);
 border-radius: 10px;
 padding: 12px 16px;
 margin-bottom: 18px;
 font-size: 0.84em;
 color: var(--slate-mid);
 display: flex;
 align-items: center;
 gap: 10px;
 line-height: 1.5;
 position: relative;
}
.tah-welcome-prompt .tah-wp-icon { font-size: 1.3em; flex-shrink: 0; }
.tah-welcome-prompt .tah-wp-close {
 position: absolute;
 top: 8px;
 right: 10px;
 background: none;
 border: none;
 cursor: pointer;
 font-size: 1em;
 color: var(--muted);
 padding: 2px 4px;
 line-height: 1;
 opacity: 0.6;
 transition: opacity 0.15s;
 font-family: 'DM Sans', sans-serif;
}
.tah-welcome-prompt .tah-wp-close:hover { opacity: 1; }
.tah-welcome-prompt strong { color: var(--pink); }

/* ── NOMINATE CTA ── */
.tah-nominate-cta {
 background: var(--teal-light);
 border: 1.5px solid rgba(0,105,92,0.2);
 border-radius: 10px;
 padding: 14px 18px;
 margin: 0 0 32px;
 display: flex;
 align-items: center;
 justify-content: space-between;
 gap: 14px;
 flex-wrap: wrap;
}
.tah-nominate-cta .tah-nc-text { font-size: 0.84em; color: var(--teal); line-height: 1.45; }
.tah-nominate-cta .tah-nc-text strong { display: block; font-size: 1.05em; margin-bottom: 2px; color: var(--slate); }
.tah-nominate-cta a.tah-nc-btn {
 padding: 8px 16px;
 background: var(--teal);
 color: #fff !important;
 border-radius: 20px;
 font-family: 'DM Sans', sans-serif;
 font-size: 0.8em;
 font-weight: 500;
 text-decoration: none;
 white-space: nowrap;
 transition: all 0.15s;
 flex-shrink: 0;
}
.tah-nominate-cta a.tah-nc-btn:hover { background: var(--slate); }

/* ── BACK TO TOP ── */
#tah-back-top {
 position: fixed;
 bottom: 28px;
 right: 20px;
 width: 40px;
 height: 40px;
 background: var(--slate);
 color: #fff;
 border: none;
 border-radius: 50%;
 cursor: pointer;
 font-size: 1.1em;
 display: none;
 align-items: center;
 justify-content: center;
 box-shadow: 0 3px 12px rgba(44,58,74,0.3);
 z-index: 999;
 transition: background 0.15s, opacity 0.2s;
 -webkit-tap-highlight-color: transparent;
}
#tah-back-top:hover { background: var(--pink); }
#tah-back-top.visible { display: flex; }

/* ── SECTION COUNT SUBTITLE ── */
.tah-section-subtitle {
 font-size: 0.75em;
 font-weight: 400;
 color: var(--muted);
 margin-left: auto;
 font-family: 'DM Sans', sans-serif;
}

/* ── CARD URGENCY BORDER ACCENTS ── */
.tah-item[data-deadline="urgent"] { border-left: 3px solid var(--red); }
.tah-item[data-deadline="soon"] { border-left: 3px solid var(--orange); }
.tah-item[data-deadline="future"] { border-left: 3px solid var(--teal); }
.tah-item[data-deadline="rolling"]{ border-left: 3px solid var(--purple); }

/* ── MOBILE FILTER TOGGLE ── */
.tah-filter-toggle {
 display: none;
 width: 100%;
 padding: 9px 16px;
 background: var(--warm-bg);
 border: none;
 border-bottom: 1px solid var(--warm-border);
 font-family: 'DM Sans', sans-serif;
 font-size: 0.82em;
 font-weight: 500;
 color: var(--slate-mid);
 cursor: pointer;
 text-align: left;
 gap: 8px;
 align-items: center;
 justify-content: space-between;
 -webkit-tap-highlight-color: transparent;
 min-height: 44px;
}
.tah-filter-toggle .tah-ft-right { display: flex; align-items: center; gap: 8px; }
.tah-filter-toggle .tah-ft-badge {
 background: var(--pink);
 color: #fff;
 border-radius: 10px;
 padding: 1px 7px;
 font-size: 0.74em;
 font-weight: 600;
 display: none;
}
.tah-filter-toggle .tah-ft-badge.visible { display: inline-block; }
.tah-filter-toggle .tah-ft-chevron { font-size: 0.8em; color: var(--muted); transition: transform 0.2s; }
.tah-filter-toggle.open .tah-ft-chevron { transform: rotate(180deg); }

.tah-filter-bar-wrap { }

/* ── SHARE FILTER BUTTON in results meta ── */
.tah-share-btn {
 padding: 6px 12px;
 border: 1.5px solid var(--warm-border2);
 border-radius: 20px;
 background: #fff;
 font-family: 'DM Sans', sans-serif;
 font-size: 0.74em;
 font-weight: 500;
 color: #666;
 cursor: pointer;
 transition: all 0.14s;
 white-space: nowrap;
 display: inline-flex;
 align-items: center;
 gap: 5px;
}
.tah-share-btn:hover { border-color: var(--pink); color: var(--pink); }

/* ── PRINT ── */
@media print {
 .tah-sticky, .tah-legend, .tah-jump-nav, .tah-filter-toggle,
 .tah-results-meta, .tah-welcome-prompt, .tah-nominate-cta,
 .tah-footer, #tah-back-top, .tah-copy-btn, .tah-btn,
 .tah-filter-bar-wrap, .tah-persona-strip { display: none !important; }
 .tah-header { padding: 16px; }
 .tah-header::before { display: none; }
 .tah-content { padding: 12px; }
 .tah-item { break-inside: avoid; border: 1px solid #ccc !important; border-left: 3px solid #999 !important; margin-bottom: 6px; box-shadow: none !important; }
 .tah-item[data-deadline="urgent"] { border-left-color: var(--red) !important; }
 .tah-item[data-deadline="soon"] { border-left-color: var(--orange) !important; }
 .tah-item[data-deadline="future"] { border-left-color: var(--teal) !important; }
 .tah-body { display: block !important; }
 .tah-chev { display: none; }
 .tah-mob-badges { display: flex !important; }
 .tah-section-title { font-size: 1em; border-bottom: 2px solid #333; }
 body { background: #fff; }
 .tah-foot { display: none !important; }
}

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
 .tah-header, .tah-persona-strip, .tah-content { padding-left: 16px; padding-right: 16px; }
 .tah-legend { padding: 10px 16px; }
 .tah-jump-nav { padding: 9px 16px; }

 /* Mobile filter toggle – show toggle, hide bar by default */
 .tah-filter-toggle { display: flex; }
 .tah-filter-bar { padding: 10px 16px; }
 .tah-filter-bar-wrap { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
 .tah-filter-bar-wrap.open { max-height: 300px; }

 /* Increase tap targets on copy buttons */
 .tah-copy-btn { min-height: 44px; padding: 8px 14px; }

 .tah-row { flex-wrap: wrap; gap: 8px; }
 .tah-title { width: 100%; }
 .tah-meta { width: 100%; margin-left: 0; }
 .tah-chev { position: absolute; top: 14px; right: 14px; }
 .tah-row { position: relative; padding-right: 36px; }
 .tah-grid { grid-template-columns: 1fr; }
 .tah-detail.full { grid-column: 1; }
 .tah-foot { flex-direction: column;
